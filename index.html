<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="description" content="Carnet de musculation : ton programme, séances libres, progression et poids de corps. Tes données restent sur ton téléphone.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Muscu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : un carnet de salle en mode nuit — une colonne, gros chiffres, un geste par écran. Thème sombre assumé. */
:root {
  color-scheme: dark;
  --bg: #0a0a0b;
  --surface: #141416;
  --surface-2: #1d1d20;
  --line: #2a2a2f;
  --fg: #f4f4f5;
  --muted: #9b9ba4;
  --faint: #62626b;
  --accent: #ff375f;
  --accent-2: #ff6b3d;
  --accent-ink: #ffffff;
  --accent-soft: #ffd3dc;
  --up: #34c759;
  --down: #ff9f0a;
  --photo: #ececef;
  --body: #232327;
  --body-mus: #2b2b30;
  --body-line: #3a3a41;
  --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-lg: 18px;
  --tab-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.app.has-action { padding-bottom: calc(var(--tab-h) + 96px + env(safe-area-inset-bottom, 0px)); }

/* Barre du haut */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); margin-inline: -16px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.top h1 { margin: 0; font: 700 17px/1.2 var(--f-body); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.back svg { width: 18px; height: 18px; }
.sync { font-size: 12px; color: var(--faint); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.ok i { background: var(--up); }
.sync.wait i { background: var(--down); }

/* Typo */
.eyebrow { font: 600 12px/1.3 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--f-display); font-stretch: 78%; font-weight: 800; letter-spacing: -.01em; line-height: .95; text-wrap: balance; }
h2.display { font-size: 40px; margin: 8px 0 0; }
.sec-title { font: 700 13px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sec-title span { letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--faint); }
.muted { color: var(--muted); }
.num { font-family: var(--f-display); font-stretch: 85%; font-variant-numeric: tabular-nums; }

/* Silhouette musculaire */
svg.body { display: block; width: 100%; height: 100%; }
.b-base { fill: var(--body); stroke: var(--body-line); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.b-mus { fill: var(--body-mus); stroke: var(--body-line); stroke-width: .8; vector-effect: non-scaling-stroke; }
.b-hi { fill: url(#accG); }
.b-sec { fill: url(#accG); opacity: .38; }

/* Accueil */
.hello { padding-top: 14px; }
.today { margin-top: 18px; border-radius: var(--r-lg); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.today .art { aspect-ratio: 16 / 9; background: #0b0b0c center / cover no-repeat; position: relative; }
.today .art .tag { position: absolute; left: 14px; top: 14px; background: rgba(10,10,11,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 6px 11px; font: 600 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; }
.today .body { padding: 16px 16px 18px; display: grid; gap: 12px; }
.today h3 { margin: 0; font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 34px; line-height: 1; }
.meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter b { display: block; height: 100%; background: var(--grad); border-radius: inherit; transition: width .4s ease; }
.cta { appearance: none; border: 0; border-radius: 14px; background: var(--grad); color: var(--accent-ink); font: 700 17px/1 var(--f-body); padding: 17px 18px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }
.cta.ghost { background: var(--surface-2); color: var(--fg); }
.cta.small { font-size: 15px; padding: 13px 14px; }
.row-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.row-stats b { color: var(--fg); font-weight: 600; }

.note-catch { font-size: 14px; line-height: 1.4; color: var(--accent-soft); background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 12px; padding: 10px 12px; }
.pick summary { list-style: none; cursor: pointer; text-align: center; color: var(--muted); font-weight: 600; font-size: 15px; padding: 4px 0; }
.pick summary::-webkit-details-marker { display: none; }
.pick summary::after { content: ' ▾'; }
.pick[open] summary::after { content: ' ▴'; }
.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.pick-grid button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 8px; text-align: left; display: grid; gap: 4px; align-content: start; }
.pick-grid button[aria-pressed="true"] { border-color: var(--accent); }
.pick-grid .th { display: block; aspect-ratio: 16 / 9; border-radius: 9px; background: #0b0b0c center / cover no-repeat; margin-bottom: 2px; }
.pick-grid b { font-size: 14px; line-height: 1.2; }
.pick-grid small { font-size: 12px; color: var(--muted); }
.pick-grid small.ok, .okc { color: var(--up); }
.langsw { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.langsw button { flex: 1; border: 0; background: none; color: var(--muted); font: 600 15px/1 var(--f-body); padding: 12px 10px; border-radius: 10px; }
.langsw button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.foot .linkbtn { display: inline-block; margin-top: 8px; text-align: center; }
.nut-card { margin-top: 16px; padding: 18px 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 16px; }
.nut-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nut-top .kc { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.nut-top .kc small { font: 600 15px var(--f-body); color: var(--muted); margin-left: 5px; }
.nut-top .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
.ring { width: 78px; height: 78px; flex: none; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.macro span { font-size: 12px; color: var(--muted); }
.macro b { display: block; font-family: var(--f-display); font-stretch: 85%; font-size: 21px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.macro b small { font: 500 12px var(--f-body); color: var(--muted); }
.macro i { display: block; height: 5px; border-radius: 999px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.macro i em { display: block; height: 100%; border-radius: inherit; }
.nut-extra { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.nut-extra b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.m-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.m-actions .cta { font-size: 15.5px; padding: 15px 12px; }
.m-actions .wide { grid-column: 1 / -1; }
.cta svg { width: 20px; height: 20px; flex: none; }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 16px; }
.daynav b { font-size: 15px; text-transform: capitalize; }
.daynav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.daynav button svg { width: 18px; height: 18px; }
.daynav button:disabled { opacity: .3; }
.meal-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); width: 100%; text-align: left; }
.meal-row .ph { width: 56px; height: 56px; border-radius: 12px; background: #1b1b1f center / cover no-repeat; display: grid; place-items: center; color: var(--faint); }
.meal-row .ph svg { width: 24px; height: 24px; }
.meal-row b { display: block; font-size: 15px; line-height: 1.25; }
.meal-row small { display: block; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.meal-row .k { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 21px; text-align: right; white-space: nowrap; }
.meal-row .k small { display: inline; font: 500 11px var(--f-body); color: var(--muted); }
.m-photo { width: 100%; aspect-ratio: 4 / 3; margin-top: 6px; border-radius: var(--r-lg); background: #1b1b1f center / cover no-repeat; border: 1px solid var(--line); position: relative; overflow: hidden; }
.m-busy { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; background: rgba(10,10,11,.6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); text-align: center; font-weight: 600; padding: 16px; }
.m-busy.flat { position: static; margin-top: 14px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); padding: 26px 16px; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.m-name { display: block; width: 100%; margin-top: 16px; border: 0; border-bottom: 1px solid transparent; background: none; font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 32px; line-height: 1.1; padding: 0 0 2px; }
.m-name:focus { outline: none; border-bottom-color: var(--accent); }
.conf { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.conf b.high { color: var(--up); }
.conf b.medium { color: var(--down); }
.conf b.low { color: var(--accent); }
.mtype { margin-top: 12px; }
.mtype button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.mtype button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto 32px; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.item b { display: block; font-size: 15px; line-height: 1.25; }
.item small { display: block; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.item label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
.item .field { width: 72px; height: 42px; font-size: 18px; }
.item .x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--muted); font-size: 18px; line-height: 1; }
.addrow { display: flex; gap: 8px; margin-top: 8px; }
.addrow input { flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 16px; }
.addrow input::placeholder { color: var(--faint); }
.addrow button { flex: none; border: 0; border-radius: 12px; background: var(--surface-2); padding: 0 14px; font-weight: 600; }
.addrow button:disabled { opacity: .5; }
.m-err { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--down) 14%, transparent); border: 1px solid color-mix(in srgb, var(--down) 35%, transparent); color: #ffd8a8; font-size: 14px; line-height: 1.4; }
.goalgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.goalgrid label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.goalgrid input { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; font-size: 17px; font-weight: 600; width: 100%; }
.goalgrid input::placeholder { color: var(--faint); }
.ai-note { font-size: 12.5px; color: var(--faint); margin: 12px 0 0; line-height: 1.45; }
.diag { display: grid; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 4px 14px; }
.diag div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.diag div:last-child { border-bottom: 0; }
.diag span { color: var(--muted); }
.diag b { text-align: right; font-weight: 600; }
.diag b.ok { color: var(--up); }
.diag b.no { color: var(--down); }
.steps { margin: 16px 0 0; padding-left: 22px; display: grid; gap: 8px; color: var(--muted); line-height: 1.45; }
.steps li::marker { color: var(--accent); font-weight: 700; }
.micro { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; font-size: 14px; }
.micro div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 7px 0; }
.micro b { font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--faint); }
.wd .dot { width: 100%; max-width: 44px; aspect-ratio: 1; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font: 700 13px/1 var(--f-body); color: var(--faint); }
.wd.done .dot { background: var(--grad); border-color: transparent; color: var(--accent-ink); }
.wd.now .dot { border-color: var(--fg); color: var(--fg); }
.wd.now { color: var(--fg); font-weight: 600; }
button.wd { border: 0; background: none; padding: 0; font-family: inherit; font-size: 12px; line-height: inherit; }
.sec-title .sec-link { border: 0; background: none; padding: 0; font: 600 13px/1 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--accent); margin-left: 10px; }
.cal { margin-top: 14px; padding: 14px 12px 12px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.cal-h, .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-h span { text-align: center; font-size: 11.5px; font-weight: 600; color: var(--faint); padding-bottom: 8px; }
.cd { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; align-content: center; gap: 2px; border: 1px solid transparent; background: none; color: var(--muted); padding: 0; font: inherit; font-variant-numeric: tabular-nums; }
.cd b { font-size: 14px; font-weight: 600; line-height: 1; }
.cd i { font-style: normal; font-size: 10px; font-weight: 700; line-height: 1; letter-spacing: .02em; }
.cd.fut { color: var(--faint); opacity: .45; }
.cd.now { border-color: var(--fg); color: var(--fg); }
.cd.on { background: var(--grad); color: var(--accent-ink); }
.cd.on.now { border-color: var(--accent-ink); }
.cal-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend i { width: 12px; height: 12px; border-radius: 4px; background: var(--grad); }
.cal-legend i.o { background: none; border: 1px solid var(--fg); }

.list { display: grid; gap: 10px; }
.s-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: center; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.s-row .thumb { width: 92px; aspect-ratio: 16/10; border-radius: 10px; background: #0b0b0c center / cover no-repeat; }
.s-row .t { min-width: 0; }
.s-row .t b { display: block; font-size: 16px; }
.s-row .t small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.chev { width: 18px; height: 18px; color: var(--faint); }

/* Séance */
.s-hero { margin-top: 6px; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16/9; background: #0b0b0c center / cover no-repeat; }
.s-head { margin: 16px 0 6px; display: grid; gap: 6px; }
.s-head h2 { font-size: 38px; margin: 0; }
.ex-list { display: grid; gap: 10px; margin-top: 18px; }
.group { border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 18px; padding: 8px; display: grid; gap: 8px; width: 100%; background: none; text-align: left; }
.group > .glabel { font: 600 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-soft); padding: 6px 6px 2px; display: flex; justify-content: space-between; }
.ex-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.mapthumb { width: 64px; height: 64px; border-radius: 12px; background: #0e0e10; position: relative; overflow: hidden; flex: none; }
.mapthumb .lb { position: absolute; left: 3px; top: 3px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--fg); color: var(--bg); font: 800 11.5px/22px var(--f-body); text-align: center; z-index: 1; }
.ex-row .t { min-width: 0; }
.ex-row .t b { display: block; font-size: 15.5px; line-height: 1.25; }
.ex-row .t small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.ex-row .t .last { color: var(--fg); opacity: .8; font-variant-numeric: tabular-nums; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.check.on { background: var(--grad); border-color: transparent; }
.check svg { width: 15px; height: 15px; }

/* Exercice */
.maphero { margin-top: 6px; border-radius: var(--r-lg); background: radial-gradient(120% 90% at 50% 40%, #1b1b1f, #09090a); border: 1px solid var(--line); aspect-ratio: 16/10; padding: 10px 0 6px; position: relative; }
.maphero .cap { position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.maphero .cap span { background: rgba(10,10,11,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
.maphero .cap span.p::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--grad); margin-right: 6px; }
.maphero .cap span.s { color: var(--muted); }
.ex-links { display: flex; gap: 8px; margin-top: 10px; }
.ex-links > * { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 10px; font-size: 14px; font-weight: 600; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; }
.ex-links svg { width: 16px; height: 16px; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border-radius: 14px; overflow: hidden; background: var(--photo); margin-top: 10px; }
.photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.ex-head { margin: 16px 0 4px; display: grid; gap: 8px; }
.ex-head h2 { font-size: 32px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--muted); white-space: nowrap; }
button.chip { color: var(--fg); }
.chip.hot { border-color: transparent; background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent-soft); }
.goal { font-size: 15px; color: var(--fg); }

.goalbox { margin-top: 18px; padding: 14px; border-radius: 16px; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface) 60%); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); display: grid; gap: 10px; }
.goalbox .hd { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.goalbox .why { font-size: 13.5px; color: var(--muted); }
.goalbox .why b { color: var(--fg); }
.lastline { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { background: var(--surface-2); border-radius: 10px; padding: 7px 10px; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.pill small { font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 2px; }
.pill.goal-p { background: var(--grad); color: #fff; }
.pill.goal-p small { color: rgba(255,255,255,.8); }
.pill.dim { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 15px; padding: 5px 9px; }
.stepbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; text-align: left; }
.wu { margin-top: 10px; padding: 10px 14px; border-radius: 14px; border: 1px dashed var(--line); font-size: 13.5px; color: var(--muted); display: grid; gap: 4px; }
.wu b { color: var(--fg); font-variant-numeric: tabular-nums; }

.sets { margin-top: 14px; display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 30px 1fr auto 28px; gap: 10px; align-items: center; padding: 10px 10px 10px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.set .n { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 22px; color: var(--faint); text-align: center; }
.set .n.ab { font-size: 15px; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.set .n.a { background: var(--accent); }
.set .n.b { background: #5e5ce6; }
.set .hint { font-size: 13px; color: var(--muted); min-width: 0; line-height: 1.25; }
.set .hint b { display: block; color: var(--fg); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set .hint .obj { display: block; color: var(--accent-soft); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.inputs { display: flex; align-items: center; gap: 6px; }
.inputs label { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--faint); }
.field { width: 66px; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); text-align: center; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; padding: 0 4px; }
.field.wide { width: 92px; }
.field::placeholder { color: var(--faint); font-weight: 600; }
.field:focus { border-color: var(--accent); outline: none; background: #232327; }
.x { color: var(--faint); font-weight: 700; padding-top: 14px; }
.delta { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.delta.up { background: color-mix(in srgb, var(--up) 22%, transparent); color: var(--up); }
.delta.down { background: color-mix(in srgb, var(--down) 22%, transparent); color: var(--down); }
.delta.eq { background: var(--surface-2); color: var(--muted); }
.setwrap { display: grid; }
.setwrap.dr .set { border-radius: 16px 16px 0 0; }
.drops { position: relative; margin-top: -1px; padding: 8px 10px 8px 52px; border: 1px solid var(--line); border-top: 1px dashed var(--line); border-radius: 0 0 16px 16px; background: var(--surface); display: grid; gap: 6px; }
.drops::before { content: ""; position: absolute; left: 26px; top: 10px; bottom: 16px; width: 2px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 60%, transparent); }
.drop { display: grid; grid-template-columns: 1fr auto 28px; gap: 10px; align-items: center; }
.drop .dl { font-size: 13px; font-weight: 600; color: var(--accent-soft); white-space: nowrap; }
.drop .field { width: 58px; height: 42px; font-size: 18px; }
.drop .x { padding-top: 12px; }
.droptools { display: flex; gap: 16px; }
.droptools button, .droplink { border: 0; background: none; padding: 4px 0; font-weight: 600; font-size: 13px; color: var(--accent); }
.droptools button + button { color: var(--muted); }
.droplink { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
.gymbar { display: flex; flex-wrap: wrap; gap: 6px; }
.gymbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 600; color: var(--muted); }
.gymbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.gymbar button.add { border-style: dashed; }
.gymnote { font-size: 13px; color: #ffd8a8; margin-top: 6px; }
.gym-card { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.gym-card label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.gym-card input { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; font-size: 16px; font-weight: 600; width: 100%; }
.gym-card input::placeholder { color: var(--faint); font-weight: 500; }
.gym-card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.gym-card .row button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 8px 13px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.gym-card .row button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.gym-card .row .del { margin-left: auto; color: var(--down); border-color: transparent; }
.set-tools { display: flex; gap: 8px; margin-top: 4px; }
.set-tools button { flex: 1; border: 1px dashed var(--line); background: none; border-radius: 12px; padding: 11px; color: var(--muted); font-weight: 600; font-size: 14px; }

.verdict { margin-top: 14px; border-radius: 16px; padding: 14px 16px; background: color-mix(in srgb, var(--up) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--up) 35%, transparent); display: grid; gap: 2px; }
.verdict.meh { background: var(--surface); border-color: var(--line); }
.verdict b { font-size: 15px; }
.verdict span { font-size: 13.5px; color: var(--muted); }

.variant { margin-top: 22px; }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); max-width: 240px; text-align: left; }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.alt { margin-top: 10px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.alt .ph { width: 96px; aspect-ratio: 4/3; border-radius: 10px; background: var(--photo) center / cover no-repeat; display: grid; place-items: center; color: #8a8a92; font-size: 12px; text-align: center; }
.alt p { margin: 0; font-size: 14px; color: var(--muted); }
.alt p b { color: var(--fg); display: block; font-size: 15px; margin-bottom: 2px; }
.coach { color: var(--up); font-size: 12px; font-weight: 700; letter-spacing: .04em; }

.note { margin-top: 14px; width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; font-size: 16px; resize: vertical; }
.note::placeholder { color: var(--faint); }

details.fold { margin-top: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
details.fold > summary { list-style: none; padding: 15px 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-size: 20px; color: var(--muted); font-weight: 400; }
details.fold[open] > summary::after { content: "−"; }
details.fold .in { padding: 0 16px 16px; color: var(--muted); font-size: 15px; display: grid; gap: 10px; }
details.fold ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
details.fold li b { color: var(--fg); }

.hist { display: grid; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.hist .h { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 12px 14px; background: var(--surface); border-top: 1px solid var(--line); align-items: baseline; }
.hist .h:first-child { border-top: 0; }
.hist .h .d { color: var(--muted); font-size: 13px; }
.hist .h .v { font-variant-numeric: tabular-nums; font-size: 14.5px; min-width: 0; }
.spark { width: 100%; height: 110px; display: block; margin-bottom: 10px; }
.spark text { fill: var(--muted); font: 600 11px var(--f-body); }

/* Superset */
.ss-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.ss-card { border-radius: 16px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; display: grid; text-align: left; padding: 0; }
.ss-card .m { aspect-ratio: 1; background: radial-gradient(100% 80% at 50% 40%, #1b1b1f, #09090a); }
.ss-card .t { padding: 10px 10px 12px; display: grid; gap: 3px; }
.ss-card .t b { font-size: 14.5px; line-height: 1.2; }
.ss-card .t small { color: var(--muted); font-size: 12.5px; }
.ss-tag { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; color: #fff; font: 800 12px/1 var(--f-body); }
.ss-tag.a { background: var(--accent); }
.ss-tag.b { background: #5e5ce6; }
.ss-flow { margin-top: 14px; font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ss-flow b { color: var(--fg); }
.ss-goals { display: grid; gap: 8px; }
.ss-goals .row { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }

/* Récap */
.rc-hero { margin-top: 14px; padding: 20px 18px; border-radius: var(--r-lg); background: var(--grad); color: #fff; display: grid; gap: 6px; }
.rc-hero .display { font-size: 38px; }
.rc-hero p { margin: 0; opacity: .92; font-size: 14.5px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; display: grid; gap: 4px; align-content: start; }
.tile .num { font-size: 30px; font-weight: 800; line-height: 1; }
.tile .num small { font-size: 14px; color: var(--muted); font-weight: 700; margin-left: 2px; }
.tile span { font-size: 12.5px; color: var(--muted); line-height: 1.2; }
.rc-list { display: grid; gap: 8px; }
.rc-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.rc-item b { display: block; font-size: 14.5px; }
.rc-item small { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.badge { border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge.rec { background: var(--grad); color: #fff; }
.badge.up { background: color-mix(in srgb, var(--up) 20%, transparent); color: var(--up); }
.badge.eq { background: var(--surface-2); color: var(--muted); }
.badge.down { background: color-mix(in srgb, var(--down) 20%, transparent); color: var(--down); }
.toggle { margin-top: 12px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); width: 100%; text-align: left; }
.toggle .box { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.toggle[aria-pressed="true"] .box { background: var(--grad); border-color: transparent; }
.toggle .box svg { width: 16px; height: 16px; }
.toggle b { display: block; }
.toggle small { color: var(--muted); font-size: 13px; }

/* Barre d'action */
.action { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 10px 16px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.action .wrap { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: auto auto 1fr; gap: 8px; position: relative; }
.bump { display: flex; gap: 6px; }
.bump .preset { padding: 0 11px; }
.restpop { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); display: grid; grid-template-columns: auto auto auto; justify-content: center; align-items: center; gap: 6px 18px; padding: 12px 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.restpop button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; height: 44px; padding: 0 14px; font-weight: 700; font-size: 15px; }
.restpop b { font-family: var(--f-display); font-stretch: 85%; font-size: 26px; font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }
.restpop small { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 12.5px; }
.timer { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; height: 54px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer svg { width: 18px; height: 18px; }
.timer.run { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.timer.ring { animation: ring .6s ease 3; }
@keyframes ring { 50% { background: var(--accent); color: #fff; } }
.preset { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; height: 54px; padding: 0 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
.action .cta { height: 54px; padding: 0 14px; }

/* Onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tab-h); }
.tabs button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--faint); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--fg); }
.tabs button[aria-current="page"] svg { color: var(--accent); }

/* Progrès */
.heat { margin-top: 6px; border-radius: var(--r-lg); background: radial-gradient(120% 90% at 50% 40%, #1b1b1f, #09090a); border: 1px solid var(--line); aspect-ratio: 16/10; padding: 10px 0; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 10px 2px 4px; }
.legend i { flex: 1; height: 6px; border-radius: 999px; background: linear-gradient(90deg, #2b2b30, var(--accent), var(--accent-2)); }
.vol { display: grid; gap: 10px; margin-top: 12px; }
.vol .r { display: grid; grid-template-columns: 96px 1fr 74px; gap: 10px; align-items: center; font-size: 14px; }
.vol .bar { height: 10px; border-radius: 999px; background: var(--surface-2); position: relative; overflow: hidden; }
.vol .bar b { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--grad); }
.vol .bar .zone { position: absolute; top: 0; bottom: 0; left: 50%; right: 0; border-left: 1px dashed rgba(255,255,255,.25); }
.vol .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
.vol .g small { display: block; font-size: 12px; color: var(--faint); }
.vol .g small.ok { color: var(--up); }
.vol .c b { color: var(--fg); }
.pr-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); width: 100%; text-align: left; }
.pr-row b { display: block; font-size: 15px; line-height: 1.25; }
.pr-row small { color: var(--muted); font-size: 12.5px; }
.pr-row svg { width: 84px; height: 26px; display: block; }
.pr-row .side { display: grid; justify-items: end; gap: 4px; }
.gain { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; min-width: 58px; text-align: right; }
.gain.pos { color: var(--up); }
.gain.zero { color: var(--muted); }
.empty { margin-top: 18px; padding: 22px 18px; border-radius: 18px; border: 1px dashed var(--line); color: var(--muted); display: grid; gap: 8px; }
.empty b { color: var(--fg); font-size: 16px; }
.data { display: grid; gap: 8px; }
.data button, .data label { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.data small { color: var(--muted); font-weight: 500; font-size: 13px; display: block; }

/* Règles */
.gold { margin-top: 16px; padding: 18px; border-radius: 18px; background: var(--grad); color: #fff; display: grid; gap: 8px; }
.gold h3 { margin: 0; font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 26px; line-height: 1.05; }
.gold ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-weight: 500; }
.gold p { margin: 0; font-size: 14px; opacity: .92; }
.gloss { display: grid; gap: 10px; }
.gloss div { font-size: 14.5px; }
.gloss b { color: var(--fg); }

/* Fiche et notification */
/* Quand l'appli est affichée dans un cadre aussi haut que la page (certaines vues de l'app Claude),
   rien ne peut rester collé en bas de l'écran : les onglets passent en haut de la page. */
html.tall .tabs { position: relative; bottom: auto; margin-inline: -16px; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; }
html.tall .app, html.tall .app.has-action { padding-bottom: 40px; }
html.tall .action { position: static; background: none; padding: 6px 0 24px; }
html.tall .toast { position: absolute; bottom: auto; }
html.tall .sheet-bg { position: absolute; inset: 0 0 auto 0; align-items: start; }
html.tall .sheet { border-radius: 22px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: grid; align-items: end; }
.sheet { background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 10px; border: 1px solid var(--line); }
.sheet h4 { margin: 0; font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 26px; }
.sheet p { margin: 0; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 90px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

/* Séance libre : carte d'accueil, sélecteur d'exercices, séance, modèles */
.chip.on { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.cta:disabled { opacity: .45; cursor: default; }
.free-card { padding: 14px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px; }
.free-card, .tplsave { grid-template-columns: minmax(0, 1fr); }
.ex-row.fx-edit { grid-template-columns: 28px 1fr auto; cursor: default; }
.fx-n { width: 28px; height: 28px; border-radius: 50%; background: var(--fg); color: var(--bg); font: 800 13px/28px var(--f-body); text-align: center; }
.free-card p { margin: 0; font-size: 13.5px; color: var(--muted); }
.free-card .cta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl-h { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
.tpls { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -14px; padding: 0 14px 2px; }
.tpls::-webkit-scrollbar { display: none; }
.tpl { flex: none; max-width: 210px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 10px 13px; text-align: left; display: grid; gap: 2px; }
.tpl b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tpl small { font-size: 12px; color: var(--muted); }
.tpl.del { border-color: color-mix(in srgb, var(--down) 55%, var(--line)); }
.tpl.del small { color: var(--down); }

/* ---------- Nombres ---------- */
const num = v => { if (v === '' || v == null) return null; const x = parseFloat(String(v).replace(',', '.')); return Number.isFinite(x) ? x : null; };

const parseTime = v => { if (v === '' || v == null) return null; const s = String(v).trim(); if (s.includes(':')) { const [m, sec] = s.split(':'); const t = (+m || 0) * 60 + (+sec || 0); return t || null; } const n = num(s); return n == null ? null : Math.round(n); };
const fmtTime = s => s == null ? '–' : `${Math.floor(s / 60)}:${pad(Math.round(s % 60))}`;
const BWREF = 75; /* repère fixe pour comparer lesté / assisté entre deux séances */
const score = (row, unit) => { if (!row) return null; if (unit === 'time') return row[0] ?? null; const [w, r] = row; if (r == null) return null; if (unit === 'bw') return r; if (unit === 'wt') return (BWREF + (w || 0)) * (1 + r / 30); if (unit === 'as') return Math.max(1, BWREF - (w || 0)) * (1 + r / 30); if (!w) return r; return w * (1 + r / 30); };

}

const STOPW = new Set(['de', 'la', 'le', 'les', 'du', 'des', 'a', 'au', 'aux', 'en', 'et', 'avec', 'sur', 'l', 'd', 'un', 'une', 'the', 'with', 'on', 'of', 'and', 'to', 'x']);
/* Rapprochement local avec la bibliothèque quand Claude n'a pas donné d'id */
function matchLib(name, en, eq, mus) {
  const words = [...new Set(norm(`${name} ${en || ''}`).split(' ').filter(w => w.length > 1 && !STOPW.has(w) && !/^\d+$/.test(w)))]; if (!words.length) return null;

}
function impNormalize(res) {

/* ---------- Poids de corps (prefs.bw = { "AAAA-MM-JJ": kg }) ---------- */
let bwDraft = null;
function bwPoints() { const m = Store.prefs.bw || {}; return Object.keys(m).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k) && +m[k] > 0).sort().map(k => ({ d: k, w: +m[k] })); }
function bwChart(pts) {
  const W = 320, H = 132, pl = 8, pr = 50, pt = 14, pb = 24;
  const t0 = parseDay(pts[0].d).getTime(), t1 = parseDay(pts[pts.length - 1].d).getTime(), span = t1 - t0 || 1;
  let lo = Math.min(...pts.map(p => p.w)), hi = Math.max(...pts.map(p => p.w)); if (hi - lo < 1) { lo -= .5; hi += .5; }
  const xs = p => pts.length === 1 ? (pl + W - pr) / 2 : pl + (parseDay(p.d).getTime() - t0) / span * (W - pl - pr);
  const ys = w => pt + (1 - (w - lo) / (hi - lo)) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${xs(p).toFixed(1)},${ys(p.w).toFixed(1)}`).join('');
  const area = pts.length > 1 ? `${line}L${xs(pts[pts.length - 1]).toFixed(1)},${H - pb}L${xs(pts[0]).toFixed(1)},${H - pb}Z` : '';
  const last = pts[pts.length - 1]; const sd = k => fmt(k, { day: 'numeric', month: 'short' }).replace(/\./g, '');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${L('Courbe du poids de corps', 'Body weight chart')} : ${esc(fmtKg(pts[0].w))} → ${esc(fmtKg(last.w))} kg">
    <defs><linearGradient id="bwg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff375f" stop-opacity=".28"/><stop offset="1" stop-color="#ff375f" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pl}" x2="${W - pr}" y1="${ys(hi)}" y2="${ys(hi)}" class="bw-grid"/><line x1="${pl}" x2="${W - pr}" y1="${ys(lo)}" y2="${ys(lo)}" class="bw-grid"/>
    ${area ? `<path d="${area}" fill="url(#bwg)"/>` : ''}<path d="${line}" fill="none" stroke="#ff375f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${xs(last).toFixed(1)}" cy="${ys(last.w).toFixed(1)}" r="4.5" fill="#ff6b3d" stroke="#0a0a0b" stroke-width="2"/>
    <text x="${W - pr + 8}" y="${(ys(hi) + 4).toFixed(1)}" class="bw-ax">${esc(fmtKg(Math.round(hi * 10) / 10))}</text><text x="${W - pr + 8}" y="${(ys(lo) + 4).toFixed(1)}" class="bw-ax">${esc(fmtKg(Math.round(lo * 10) / 10))}</text>
    <text x="${pl}" y="${H - 6}" class="bw-ax">${esc(sd(pts[0].d))}</text>${pts.length > 1 ? `<text x="${W - pr}" y="${H - 6}" text-anchor="end" class="bw-ax">${esc(sd(last.d))}</text>` : ''}
    <line id="bw-cx" x1="0" x2="0" y1="${pt}" y2="${H - pb}" class="bw-cross" visibility="hidden"/><circle id="bw-cd" r="5" fill="#ff375f" stroke="#0a0a0b" stroke-width="2" visibility="hidden"/>
  </svg><div class="bw-tip" id="bw-tip" hidden></div>`;
}
/* Survol / appui sur la courbe : valeur et date du point le plus proche */
function bwHover(ev) {
  const box = ev.target.closest && ev.target.closest('.bw-chart'); const tip = document.getElementById('bw-tip'); if (!tip) return;
  const cx = document.getElementById('bw-cx'), cd = document.getElementById('bw-cd');
  if (!box || ev.type === 'pointerleave') { tip.hidden = true; cx?.setAttribute('visibility', 'hidden'); cd?.setAttribute('visibility', 'hidden'); return; }
  const pts = bwPoints().slice(-120); if (!pts.length) return; const svg = box.querySelector('svg'); const r = svg.getBoundingClientRect();
  const W = 320, H = 132, pl = 8, pr = 50, pt = 14, pb = 24; const vx = (ev.clientX - r.left) / r.width * W;
  const t0 = parseDay(pts[0].d).getTime(), t1 = parseDay(pts[pts.length - 1].d).getTime(), span = t1 - t0 || 1;
  let lo = Math.min(...pts.map(p => p.w)), hi = Math.max(...pts.map(p => p.w)); if (hi - lo < 1) { lo -= .5; hi += .5; }
  const xs = p => pts.length === 1 ? (pl + W - pr) / 2 : pl + (parseDay(p.d).getTime() - t0) / span * (W - pl - pr);
  let best = pts[0]; for (const p of pts) if (Math.abs(xs(p) - vx) < Math.abs(xs(best) - vx)) best = p;
  const x = xs(best), y = pt + (1 - (best.w - lo) / (hi - lo)) * (H - pt - pb);
  cx.setAttribute('x1', x); cx.setAttribute('x2', x); cx.setAttribute('visibility', 'visible'); cd.setAttribute('cx', x); cd.setAttribute('cy', y); cd.setAttribute('visibility', 'visible');
  tip.innerHTML = `<b>${esc(fmtKg(best.w))} kg</b><small>${esc(fmt(best.d, { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, ''))}</small>`; tip.hidden = false;
  const px = x / W * r.width; tip.style.left = Math.min(Math.max(px, 44), r.width - 44) + 'px';
}

      if (Array.isArray(dd.free)) { const have = new Set((cur.free || []).map(f => f.id)); const add = dd.free.filter(f => f && typeof f.id === 'string' && Array.isArray(f.list) && !have.has(f.id)); if (add.length) { cur.free = [...(cur.free || []), ...add]; changed = true; } }
      if (dd.cardio && !cur.cardio) { cur.cardio = true; changed = true; }
      if (!cur.start && dd.start) cur.start = dd.start;
      if (changed) { added++; Store.touch(day); } else if (!Object.keys(cur.ex).length && !cur.cardio && !(cur.free || []).length) delete Store.days[day];
    }
    if (o.prefs && Array.isArray(o.prefs.gyms) && o.prefs.gyms.length && !(Store.prefs.gyms || []).length) { saveGyms(o.prefs.gyms); if (o.prefs.home) Store.setPref('home', o.prefs.home); }
    let mAdded = 0;
    for (const [day, list] of Object.entries(o.meals || {})) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !Array.isArray(list)) continue;
      const have = Store.meals[day] || []; const ids = new Set(have.map(m => m.id));
      const add = list.filter(m => m && m.id && !ids.has(m.id) && Array.isArray(m.items));
      if (add.length) { Store.putMeals(day, [...have, ...add].sort((a, b) => a.t - b.t)); mAdded += add.length; }
    }
    if (o.nutritionTargets && !Object.keys(Store.prefs.nutri || {}).length) for (const [k, v] of Object.entries(o.nutritionTargets)) Store.setNutri(k, +v);
    const parts = [];
    if (added) parts.push(L(`${added} jour${added > 1 ? 's' : ''} d'entraînement`, `${added} training day${added > 1 ? 's' : ''}`));
    if (mAdded) parts.push(L(`${mAdded} repas`, `${mAdded} meal${mAdded > 1 ? 's' : ''}`));
    toast(parts.length ? L('Importé : ', 'Imported: ') + parts.join(' + ') : L('Rien de nouveau à importer', 'Nothing new to import'));
    render();
  };
  rd.readAsText(file);
}

function itemNow(it) { const k = it.g0 > 0 ? it.g / it.g0 : 1; const o = {}; for (const n of NUT) o[n] = (it.b[n] || 0) * k; return o; }

const dayNut = day => sumItems((Store.meals[day] || []).flatMap(m => m.items || []));
const itemLine = v => `${nf(v.kcal)} kcal · P ${nf(v.p)} · ${L('G', 'C')} ${nf(v.c)} · ${L('L', 'F')} ${nf(v.f)}`;
function normItems(arr) {
  return (Array.isArray(arr) ? arr : []).slice(0, 30).map(x => {
    const g = +x?.g > 0 ? Math.round(+x.g) : 100; const b = {};

/* Photo : réduite et réencodée en JPEG (aussi pour les photos HEIC de l'iPhone) + miniature carrée */
async function loadBitmap(file) {
  try { return await createImageBitmap(file); } catch (e) {}
  return await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
}
async function prepPhoto(file) {
  const bm = await loadBitmap(file); const w = bm.width, h = bm.height;
  const s = Math.min(1, 1600 / Math.max(w, h)); const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  const side = Math.min(w, h); const t = document.createElement('canvas'); t.width = t.height = 240;
  t.getContext('2d').drawImage(bm, (w - side) / 2, (h - side) / 2, side, side, 0, 0, 240, 240);
  return { blob: blob || file, thumb: t.toDataURL('image/jpeg', 0.62) };
}
